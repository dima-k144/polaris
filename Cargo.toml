[package]
name = "mlisp"
version = "0.1.0"
edition = "2024"

[dependencies]
polars = { 
    version = "0.54", 
    features = [
        "lazy", "csv", "semi_anti_join", "strings", "regex", "cum_agg", "rank",
        "temporal", "dtype-date", "dtype-datetime", "dtype-duration", "dtype-time",
        "parquet", "streaming", "pivot", "performant", "cse", "nightly"
   ] 
}
polars-ops = { version = "0.55.2", features = ["pivot"] }
plotlars = { version = "0.12.6", features = ["plotly"] }
tikv-jemallocator = { version = "*" }
rustyline = "14.0"
dirs = "5.0"
either = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
