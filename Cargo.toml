[package]
name = "mlisp"
version = "0.1.0"
edition = "2024"

[dependencies]
polars = { 
    version = "0.54", 
    features = [
        "lazy", "csv", "semi_anti_join", "strings", "regex", "cum_agg", "rank",
        "temporal", "dtype-date", "dtype-datetime", "dtype-duration", "dtype-time",
        "parquet", "streaming", "pivot", "performant"
   ] 
}
polars-ops = { version = "0.55.2", features = ["pivot"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1", features = ["full"] }
termimad = "0.31"
plotlars = { version = "0.12.6", features = ["plotly"] }
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
